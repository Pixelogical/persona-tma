# Serves the built Mini App and mirrors the vite dev proxy:
# every /api call goes to the backend container — one single origin,
# so the frontend keeps using relative URLs everywhere.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # avatar uploads are capped at 2 MB by the app; leave headroom
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed vite bundles: safe to cache forever
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise Telegram's WebView keeps
    # serving the previous bundle and new deploys stay invisible
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
